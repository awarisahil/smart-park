# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (or java -jar target/*.jar --spring.profiles.active=mysql)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
